<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300"><style>.f{font-family:'Google Sans Flex','Google Sans','Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif} .s{font-family:'Instrument Serif',Georgia,'Times New Roman',serif;font-style:italic} .c{opacity:0;animation:up .8s cubic-bezier(.2,.8,.2,1) forwards} @keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}} @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}</style><g class="f"><line x1="0" y1="1" x2="1200" y2="1" stroke="#0B0D12" stroke-width="2"/><g class="c" style="animation-delay:0.0s"><text x="0" y="54" font-size="15" font-weight="700" letter-spacing="1.2" fill="#1F4FFF">01</text><text x="0" y="120" font-size="40" font-weight="800" letter-spacing="-1.6" fill="#0B0D12">Models</text><text x="0" y="164" font-size="17" fill="#5B6270">Small language models, LoRA</text><text x="0" y="190" font-size="17" fill="#5B6270">and QLoRA fine-tunes,</text><text x="0" y="216" font-size="17" fill="#5B6270">distillation and</text><text x="0" y="242" font-size="17" fill="#5B6270">quantization for fast,</text><text x="0" y="268" font-size="17" fill="#5B6270">private inference.</text></g><g class="c" style="animation-delay:0.12s"><line x1="288" y1="40" x2="288" y2="270" stroke="#E6E9F0"/><text x="308" y="54" font-size="15" font-weight="700" letter-spacing="1.2" fill="#1F4FFF">02</text><text x="308" y="120" font-size="40" font-weight="800" letter-spacing="-1.6" fill="#0B0D12">Agents</text><text x="308" y="164" font-size="17" fill="#5B6270">Multi agent systems, tool</text><text x="308" y="190" font-size="17" fill="#5B6270">use, RAG and evals that hold</text><text x="308" y="216" font-size="17" fill="#5B6270">up in production, not just a</text><text x="308" y="242" font-size="17" fill="#5B6270">demo.</text></g><g class="c" style="animation-delay:0.24s"><line x1="596" y1="40" x2="596" y2="270" stroke="#E6E9F0"/><text x="616" y="54" font-size="15" font-weight="700" letter-spacing="1.2" fill="#1F4FFF">03</text><text x="616" y="120" font-size="40" font-weight="800" letter-spacing="-1.6" fill="#0B0D12">Interfaces</text><text x="616" y="164" font-size="17" fill="#5B6270">Copilots, agent consoles and</text><text x="616" y="190" font-size="17" fill="#5B6270">dashboards that make complex</text><text x="616" y="216" font-size="17" fill="#5B6270">AI feel calm and obvious.</text></g><g class="c" style="animation-delay:0.36s"><line x1="904" y1="40" x2="904" y2="270" stroke="#E6E9F0"/><text x="924" y="54" font-size="15" font-weight="700" letter-spacing="1.2" fill="#1F4FFF">04</text><text x="924" y="120" font-size="40" font-weight="800" letter-spacing="-1.6" fill="#0B0D12">Shipping</text><text x="924" y="164" font-size="17" fill="#5B6270">Next.js, TypeScript and</text><text x="924" y="190" font-size="17" fill="#5B6270">Python on Azure. One loop</text><text x="924" y="216" font-size="17" fill="#5B6270">from Paper frame to deployed</text><text x="924" y="242" font-size="17" fill="#5B6270">product.</text></g></g></svg>