<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250"><style>.f{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif} .c{opacity:0;animation:up .8s cubic-bezier(.2,.8,.2,1) forwards} @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}} .bar{transform:scaleX(0);animation:grow 1.4s cubic-bezier(.2,.8,.2,1) forwards} @keyframes grow{to{transform:scaleX(1)}} @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}</style><g class="f"><g class="c" style="animation-delay:0.0s"><rect x="0.5" y=".5" width="391" height="249" rx="22" fill="#FFFFFF" stroke="#D5E2F1"/><rect class="bar" style="transform-origin:32px 0;animation-delay:0.3s" x="32" y="34" width="56" height="5" rx="2.5" fill="#0E75B6"/><text x="359" y="44" text-anchor="end" font-size="14" font-weight="600" fill="#4B5D78">01</text><text x="32" y="96" font-size="30" font-weight="700" letter-spacing="-.8" fill="#0A1A33">Design</text><text x="32" y="140" font-size="16.5" fill="#4B5D78">Design systems, enterprise dashboards,</text><text x="32" y="166" font-size="16.5" fill="#4B5D78">agent and copilot interfaces, brands</text><text x="32" y="192" font-size="16.5" fill="#4B5D78">and decks that close deals.</text></g><g class="c" style="animation-delay:0.15s"><rect x="404.5" y=".5" width="391" height="249" rx="22" fill="#FFFFFF" stroke="#D5E2F1"/><rect class="bar" style="transform-origin:436px 0;animation-delay:0.44999999999999996s" x="436" y="34" width="56" height="5" rx="2.5" fill="#0891B2"/><text x="763" y="44" text-anchor="end" font-size="14" font-weight="600" fill="#4B5D78">02</text><text x="436" y="96" font-size="30" font-weight="700" letter-spacing="-.8" fill="#0A1A33">Build</text><text x="436" y="140" font-size="16.5" fill="#4B5D78">Pixel faithful React and Next.js,</text><text x="436" y="166" font-size="16.5" fill="#4B5D78">Tailwind, motion and 3D scroll, with a</text><text x="436" y="192" font-size="16.5" fill="#4B5D78">tight design to code loop.</text></g><g class="c" style="animation-delay:0.3s"><rect x="808.5" y=".5" width="391" height="249" rx="22" fill="#FFFFFF" stroke="#D5E2F1"/><rect class="bar" style="transform-origin:840px 0;animation-delay:0.6s" x="840" y="34" width="56" height="5" rx="2.5" fill="#4F6BED"/><text x="1167" y="44" text-anchor="end" font-size="14" font-weight="600" fill="#4B5D78">03</text><text x="840" y="96" font-size="30" font-weight="700" letter-spacing="-.8" fill="#0A1A33">Intelligence</text><text x="840" y="140" font-size="16.5" fill="#4B5D78">LLM products, multi agent workflows,</text><text x="840" y="166" font-size="16.5" fill="#4B5D78">voice AI, and generative image and</text><text x="840" y="192" font-size="16.5" fill="#4B5D78">video for storytelling.</text></g></g></svg>