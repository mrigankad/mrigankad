<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300"><style>.f{font-family:'Google Sans Flex','Google Sans','Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif} .s{font-family:'Instrument Serif',Georgia,'Times New Roman',serif;font-style:italic} .c{opacity:0;animation:up .8s cubic-bezier(.2,.8,.2,1) forwards} @keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}} @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}</style><g class="f"><line x1="0" y1="1" x2="1200" y2="1" stroke="#F4F6FB" stroke-width="2"/><g class="c" style="animation-delay:0.0s"><text x="0" y="54" font-size="15" font-weight="700" letter-spacing="1.2" fill="#6E8BFF">01</text><text x="0" y="120" font-size="48" font-weight="800" letter-spacing="-2" fill="#F4F6FB">Agents</text><text x="0" y="170" font-size="18" fill="#9AA3B2">Multi agent systems, tool use, RAG</text><text x="0" y="198" font-size="18" fill="#9AA3B2">and evals. Orchestration that holds</text><text x="0" y="226" font-size="18" fill="#9AA3B2">up in production, not just in a</text><text x="0" y="254" font-size="18" fill="#9AA3B2">demo.</text></g><g class="c" style="animation-delay:0.12s"><line x1="386" y1="40" x2="386" y2="270" stroke="#222838"/><text x="410" y="54" font-size="15" font-weight="700" letter-spacing="1.2" fill="#6E8BFF">02</text><text x="410" y="120" font-size="48" font-weight="800" letter-spacing="-2" fill="#F4F6FB">Interfaces</text><text x="410" y="170" font-size="18" fill="#9AA3B2">Copilots, agent consoles and</text><text x="410" y="198" font-size="18" fill="#9AA3B2">enterprise dashboards that make</text><text x="410" y="226" font-size="18" fill="#9AA3B2">complex AI feel calm and obvious.</text></g><g class="c" style="animation-delay:0.24s"><line x1="796" y1="40" x2="796" y2="270" stroke="#222838"/><text x="820" y="54" font-size="15" font-weight="700" letter-spacing="1.2" fill="#6E8BFF">03</text><text x="820" y="120" font-size="48" font-weight="800" letter-spacing="-2" fill="#F4F6FB">Shipping</text><text x="820" y="170" font-size="18" fill="#9AA3B2">Next.js, TypeScript and Python on</text><text x="820" y="198" font-size="18" fill="#9AA3B2">Azure. One loop from Paper frame to</text><text x="820" y="226" font-size="18" fill="#9AA3B2">deployed product.</text></g></g></svg>